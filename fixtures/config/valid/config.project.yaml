# schema: config
schemaVersion: 1
project: { id: shop, defaultBranch: main, protectedBranches: [main, release] }
runtime: { id: pi, pi: { loadFrom: package } }
authentication: { mode: subscription, allowApiKeys: false }
routing:
  allowedProviders: [openai-codex]
  defaults: { implementer: coding, fixer: coding, reviewer: reasoning }
  tiers:
    coding: { ref: { provider: openai-codex, model: gpt-5.5 }, thinking: medium }
    reasoning: { ref: { provider: openai-codex, model: gpt-5.5 }, thinking: high }
  escalation: { sameFailureCount: 2, ladder: [{ kind: human }], maxPerRun: 2 }
  fallback: { enabled: false }
budgets:
  run: { wallClockMs: 3600000, toolCalls: 5000 }
  phase: {}
  agent: { modelRequests: 150 }
  provider: { openai-codex: { estimatedQuotaPercent: 80 } }
  tool: { run_command: { toolCalls: 200 } }
  concurrency: 3
  maxIncarnations: 5
loop: { maxFixRounds: 5, noProgressWindow: 3, maxDeniedCallsPerAgent: 5, leftovers: { major: fix, minor: park, info: park } }
checks: { typecheck: [pnpm, typecheck], test: [pnpm, test], timeoutMs: 600000 }
provision:
  argv: [pnpm, install, --frozen-lockfile, --ignore-scripts, --offline]
  network: false
  cacheDirs: []
  lockfiles: [pnpm-lock.yaml]
  env: {}
  dependencyDirs: ["**/node_modules"]
  writableCaches: [node_modules/.cache]
policy:
  commands:
    allow:
      - { id: pnpm-run-test, program: pnpm, subcommand: [run], positionals: { kind: enum, values: [test, lint], max: 1 }, decision: allow, replay: idempotent, network: false, origin: project-config }
    ask: []
    deny: []
  dangerousCommands: []
  symlinks: { mode: deny-outgoing, hardlinksOnWrite: deny }
  approvals: { unattended: deny, parkAfterMinutes: 10, ship: human, notify: false, autoResume: false }
  inDoubt: ask
  skip: []
  steer: { enabled: false }
  admin: { runTool: false }
  quota: { autoResume: false }
host: { idleExitMinutes: 30, pauseKeepAliveMinutes: 30, pollMs: 250 }
network: { proxyEnv: false }
sandbox: { brain: os-if-available }
git: { branchPrefix: cohorte/, commitIdentity: user, keepWorktrees: on-failure }
retention: { transcriptsDays: 30, eventsDays: forever, artifactsDays: 90, compressAfterDays: 7 }
telemetry: { remote: false }
