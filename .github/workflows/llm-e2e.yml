name: Real-model end-to-end

# Drives /cohorte-build and /cohorte-review with a real model on a toy repo and asserts on the
# files they leave (scripts/ci/llm-e2e.sh) — the one test that can catch a regression in the
# prompts themselves. A few dollars per run, so: nightly and on demand, never on every push.
# Needs the ANTHROPIC_API_KEY repository secret; without it the job says so and stops.

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llm-e2e:
    name: Real-model end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_VERSION: 2.1.325
    steps:
      - name: Skip without an API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY is not set — the real-model end-to-end run is skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 24
      - name: Install Claude Code (pinned)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Build and review a feature with a real model
        if: env.ANTHROPIC_API_KEY != ''
        run: LLM_E2E_DIR="$RUNNER_TEMP/llm-e2e" bash scripts/ci/llm-e2e.sh
      - name: Keep the logs
        if: always() && env.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llm-e2e-logs
          path: |
            ${{ runner.temp }}/llm-e2e/logs
            ${{ runner.temp }}/llm-e2e/repo/specs
          if-no-files-found: ignore
