name: Publish to npm

# Runs only AFTER CI succeeded on a push to main, on exactly the commit CI tested — publish
# used to start in parallel with CI, so a red Windows job could still ship. The npm-publish
# environment additionally requires a maintainer's approval and only accepts `main`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual retry (e.g. a first trusted-publishing run that failed) — still main-only, still
  # behind the npm-publish environment's approval.
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    name: Sanity check
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-publish: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.local }}
      dist-tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The same suites CI just ran, re-run on the exact tree about to be packed: cheap, and
      # it keeps this workflow honest if CI's job list ever drifts (validate-core pins both).
      - name: Test suites (same gate as CI)
        run: |
          node scripts/validate-core.mjs
          node scripts/test-install.mjs
          node scripts/test-gate.mjs
          node scripts/test-lib.mjs
          node scripts/test-workflows.mjs
          node scripts/test-kanban.mjs
          node scripts/test-metrics.mjs
          node scripts/test-e2e.mjs
          python3 -B -m py_compile core/hooks/gate.py

      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q 'lib/doctor.js' /tmp/pack.txt
          grep -q 'lib/project.js' /tmp/pack.txt
          if grep -qiE '__pycache__|\.pyc' /tmp/pack.txt; then
            echo "::error::the npm tarball contains Python bytecode"; exit 1
          fi

      - name: Compare local vs published version
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          # A pre-release (x.y.z-rc.1) must never become `latest`.
          case "$LOCAL" in *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;; *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;; esac
          # Existence check, NOT a compare against the `latest` dist-tag: after a rollback of
          # main, latest != local would re-publish the old version and DOWNGRADE latest.
          if npm view "$NAME@$LOCAL" version >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL already on the registry — skipping."
            exit 0
          fi
          LATEST=$(npm view "$NAME" version 2>/dev/null || echo "0.0.0")
          # Semver-aware: a pre-release sorts below its release (3.0.0-dev.8 < 3.0.0).
          node -e "
            const { cmpSemver } = require('./lib/versions.js');
            const local = '$LOCAL', latest = '$LATEST';
            if (!local.includes('-') && cmpSemver(local, latest) <= 0) {
              console.error('::error::local ' + local + ' does not sort above published latest ' + latest + ' — publishing would downgrade latest');
              process.exit(1);
            }"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Version $LOCAL not yet published (latest is $LATEST) — will publish."

      - name: Require a CHANGELOG entry for the new version
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.local }}
        run: |
          if grep -qE "^## ${VERSION//./\\.}( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has an entry for $VERSION."
          else
            echo "::error file=CHANGELOG.md::Missing '## $VERSION — <date>' section."
            exit 1
          fi

  publish:
    name: Publish v${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # the vX.Y.Z tag + GitHub release
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Token-less trusted publishing needs npm >= 11.5.1. Pinned, not @latest: this step runs
      # with an OIDC token that can publish.
      - name: Ensure npm 11.6 for OIDC
        run: |
          npm install -g npm@11.6.2
          npm --version

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ needs.check.outputs.dist-tag }}"

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          git fetch --tags --quiet
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists"
          else
            git tag "v$VERSION" "$SHA"
            git push origin "v$VERSION"
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists"
          else
            flags=""
            case "$VERSION" in *-*) flags="--prerelease" ;; esac
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes $flags
          fi
