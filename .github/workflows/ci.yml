name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The whole suite, on every OS a user installs from. Installer behaviour is asserted by
    # scripts/test-install.mjs against the real CLI in a scratch CLAUDE_CONFIG_DIR — the same
    # postconditions everywhere, instead of one shell dry-run per platform that drifts.
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20, python: '3.10' }
          - { os: ubuntu-latest, node: 22, python: '3.12' }
          - { os: ubuntu-latest, node: 24, python: '3.13' }
          # The floor (3.9) is what stock macOS ships as /usr/bin/python3 — no runner image
          # offers it through setup-python any more, so test it as users have it.
          - { os: macos-latest, node: 24, python: system }
          - { os: windows-latest, node: 24, python: '3.13' }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}

      - name: Use the system python3
        if: matrix.python == 'system'
        run: |
          echo "/usr/bin" >> "$GITHUB_PATH"
          /usr/bin/python3 --version

      # On Windows the gate is invoked as `python3` by the committed project hook; make sure
      # that name resolves on the runner so test-install can execute the copied gate.
      - name: Expose python3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command python3 -ErrorAction SilentlyContinue)) {
            $py = (Get-Command python).Source
            Copy-Item $py (Join-Path (Split-Path $py) 'python3.exe')
          }
          python3 --version

      - name: Syntax-check CLI, libs and the gate
        shell: bash
        run: |
          node --check bin/cli.js bin/report.js
          for f in lib/*.js; do node --check "$f"; done
          # ast.parse, not py_compile: py_compile writes __pycache__ even under -B, and the gate
          # suite (rightly) fails when a bytecode cache sits next to gate.py.
          python3 -c "import ast, sys; ast.parse(open('core/hooks/gate.py', encoding='utf-8').read()); print(sys.version)"

      - name: Build the dashboard (typecheck + server + page)
        shell: bash
        run: |
          npm run build:ui
          npm --prefix ui run typecheck
          npm --prefix ui test

      - name: Structural invariants
        run: node scripts/validate-core.mjs

      - name: Installer, uninstall and project wiring
        run: node scripts/test-install.mjs

      - name: Gate hook behaviour
        run: node scripts/test-gate.mjs

      - name: Shared readers (doctor, specs, yaml)
        run: node scripts/test-lib.mjs

      - name: Workflow behaviour
        run: node scripts/test-workflows.mjs

      - name: Kanban mirror
        if: runner.os != 'Windows'
        run: node scripts/test-kanban.mjs

      - name: Metrics collector
        run: node scripts/test-metrics.mjs

      - name: Verify runner (dev server lifecycle, migrations, rollback)
        if: runner.os != 'Windows'
        run: node scripts/test-verify.mjs

      - name: Dashboard (registry, local HTTP security)
        run: node scripts/test-ui.mjs

      - name: Dashboard unit tests (vitest)
        run: npm --prefix ui test

      - name: Company flow (PO → CP0 → lead → CP1 → autopilot + decider → CP3 → PR → acceptance)
        run: node scripts/test-flow.mjs

      - name: End-to-end (install → sync → feature diff → preflight → gate → kanban → uninstall)
        run: node scripts/test-e2e.mjs

      # install.ps1 runs on Windows PowerShell 5.1 AND PowerShell 7; 5.1 mangles native-argument
      # quoting (the 2.x Node probe reported every Node as v0 there), so run both.
      - name: install.ps1 under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'coh-ps51'
          $env:COHORTE_NO_VERSION_CHECK = '1'
          .\install.ps1
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          $v = (Get-Content (Join-Path $env:CLAUDE_CONFIG_DIR 'cohorte\pipeline\VERSION')).Trim()
          if ($v -ne (node -p "require('./package.json').version")) { throw "VERSION is '$v'" }

      - name: install.ps1 under PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'coh-pwsh'
          $env:COHORTE_NO_VERSION_CHECK = '1'
          .\install.ps1 -Update
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $env:CLAUDE_CONFIG_DIR 'commands\cohorte-build.md'))) { throw 'no commands installed' }

  package:
    # The tarball is the release artifact: assert what it does and does NOT carry. `.npmignore`
    # is inert under an explicit package.json `files` allowlist — only its negations work.
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Shell installers parse
        run: bash -n install.sh && sh -n install.sh
      - name: install.sh installs this checkout
        run: |
          scratch=$(mktemp -d)
          # ./ is load-bearing: without a slash in $0 the script fetches the latest release.
          HOME="$scratch" COHORTE_NO_VERSION_CHECK=1 sh ./install.sh
          test -f "$scratch/.claude/cohorte/pipeline/VERSION"
          test "$(cat "$scratch/.claude/cohorte/pipeline/VERSION")" = "$(node -p "require('./package.json').version")"
      - name: Tarball carries no bytecode and no test suite
        run: |
          python3 -m py_compile core/hooks/gate.py   # make the cache exist first
          npm run build:ui
          npm pack --dry-run --ignore-scripts 2>&1 | tee /tmp/pack.txt
          # the dashboard ships BUILT: its page and compiled server, never its sources or build tooling
          grep -q 'ui/dist-web/index.html' /tmp/pack.txt
          grep -q 'ui/dist-server/server/server.js' /tmp/pack.txt
          if grep -qE 'ui/(web|server|shared|node_modules)/|ui/(package|tsconfig[a-z.]*|vite\.config)\.' /tmp/pack.txt; then
            echo "::error::the npm tarball ships the dashboard's sources or build tooling — only ui/dist-server and ui/dist-web ship"; exit 1
          fi
          if grep -qiE '__pycache__|\.pyc' /tmp/pack.txt; then
            echo "::error::the npm tarball contains Python bytecode — fix package.json files negations"; exit 1
          fi
          if grep -qE 'scripts/(test-[a-z-]+|validate-core)\.mjs' /tmp/pack.txt; then
            echo "::error::the npm tarball ships the test suite"; exit 1
          fi
          if grep -qE 'core/hooks/gate/|scripts/build-gate\.mjs' /tmp/pack.txt; then
            echo "::error::the npm tarball ships the gate's source modules or its builder — only the built core/hooks/gate.py ships"; exit 1
          fi
          grep -q 'core/hooks/gate.py' /tmp/pack.txt
          grep -q 'lib/project.js' /tmp/pack.txt
          rm -rf core/hooks/__pycache__
