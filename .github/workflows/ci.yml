name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The whole suite, on every OS a user installs from. Installer behaviour is asserted by
    # scripts/test-install.mjs against the real CLI in a scratch CLAUDE_CONFIG_DIR — the same
    # postconditions everywhere, instead of one shell dry-run per platform that drifts.
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20, python: '3.9' }
          - { os: ubuntu-latest, node: 22, python: '3.12' }
          - { os: ubuntu-latest, node: 24, python: '3.13' }
          - { os: macos-latest, node: 24, python: '3.13' }
          - { os: windows-latest, node: 24, python: '3.13' }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # On Windows the gate is invoked as `python3` by the committed project hook; make sure
      # that name resolves on the runner so test-install can execute the copied gate.
      - name: Expose python3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          Copy-Item $py (Join-Path (Split-Path $py) 'python3.exe')

      - name: Syntax-check CLI, libs and the gate
        shell: bash
        run: |
          node --check bin/cli.js bin/report.js
          for f in lib/*.js; do node --check "$f"; done
          python -B -m py_compile core/hooks/gate.py

      - name: Structural invariants
        run: node scripts/validate-core.mjs

      - name: Installer, uninstall and project wiring
        run: node scripts/test-install.mjs

      - name: Gate hook behaviour
        run: node scripts/test-gate.mjs

      - name: Shared readers (doctor, specs, yaml)
        run: node scripts/test-lib.mjs

      - name: Workflow behaviour
        run: node scripts/test-workflows.mjs

      - name: Kanban mirror
        if: runner.os != 'Windows'
        run: node scripts/test-kanban.mjs

      - name: Metrics collector
        run: node scripts/test-metrics.mjs

  package:
    # The tarball is the release artifact: assert what it does and does NOT carry. `.npmignore`
    # is inert under an explicit package.json `files` allowlist — only its negations work.
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Shell installers parse
        run: bash -n install.sh && sh -n install.sh
      - name: install.sh installs this checkout
        run: |
          scratch=$(mktemp -d)
          # ./ is load-bearing: without a slash in $0 the script fetches the latest release.
          HOME="$scratch" COHORTE_NO_VERSION_CHECK=1 sh ./install.sh
          test -f "$scratch/.claude/cohorte/pipeline/VERSION"
          test "$(cat "$scratch/.claude/cohorte/pipeline/VERSION")" = "$(node -p "require('./package.json').version")"
      - name: Tarball carries no bytecode and no test suite
        run: |
          python3 -m py_compile core/hooks/gate.py   # make the cache exist first
          npm pack --dry-run --ignore-scripts 2>&1 | tee /tmp/pack.txt
          if grep -qiE '__pycache__|\.pyc' /tmp/pack.txt; then
            echo "::error::the npm tarball contains Python bytecode — fix package.json files negations"; exit 1
          fi
          if grep -qE 'scripts/(test-[a-z-]+|validate-core)\.mjs' /tmp/pack.txt; then
            echo "::error::the npm tarball ships the test suite"; exit 1
          fi
          grep -q 'core/hooks/gate.py' /tmp/pack.txt
          grep -q 'lib/project.js' /tmp/pack.txt
          rm -rf core/hooks/__pycache__
