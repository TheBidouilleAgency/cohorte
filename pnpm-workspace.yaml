# Workspace packages: apps/* and packages/* ONLY.
# Never docs/ (a VitePress site with its own npm toolchain) and never legacy/ (V2, reference only).
packages:
  - apps/*
  - packages/*

# The single source of versions: every package.json says "catalog:".
# Exact pins are deliberate (ADR-0016): TypeScript 7 and tsdown are young, Biome runs a nursery rule,
# typebox must equal Pi's own pin, and Pi ships about eleven releases a month.
catalog:
  '@biomejs/biome': 2.5.14
  '@earendil-works/pi-agent-core': 0.85.1
  '@earendil-works/pi-ai': 0.85.1
  '@earendil-works/pi-coding-agent': 0.85.1
  '@types/node': ^24
  '@types/picomatch': ^4.0.3
  ajv: ^8.20.0
  ajv-formats: ^3.0.1
  commander: ^15.0.0
  picomatch: ^4.0.7
  tsdown: 0.23.0
  typebox: 1.3.7
  typescript: 7.0.2
  vitest: ^5.0.1
  yaml: ^2.9.1

# pnpm ignores Pi's shrinkwrap, and a caret on a 0.x range could install two pi-ai copies, which
# breaks `instanceof ModelsError` across them (DESIGN 1.4). typebox follows Pi's exact pin.
overrides:
  '@earendil-works/pi-agent-core': 0.85.1
  '@earendil-works/pi-ai': 0.85.1
  '@earendil-works/pi-coding-agent': 0.85.1
  typebox: 1.3.7

# pnpm 12 refuses to install until every dependency with a build script has an explicit answer.
# None of the three is needed built: nothing here runs @google/genai's or protobufjs' postinstall,
# and esbuild's binary comes from its platform package.
allowBuilds:
  '@google/genai': false
  esbuild: false
  protobufjs: false
